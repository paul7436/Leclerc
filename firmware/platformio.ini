; PlatformIO project for the turret firmware.
;
;   pio run                 build for the ESP32-S3
;   pio run -t upload       flash the board
;   pio device monitor      open the serial console
;   pio test -e native      run the logic unit tests on the development machine

[platformio]
default_envs = esp32s3

; Warnings apply to the project sources only, not to the framework.
[env]
build_src_flags =
    -Wall
    -Wextra

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
    madhephaestus/ESP32Servo@^3.0.0
; The default Serial object is the UART behind the board's "UART" USB port.
; To use the native "USB" port instead, uncomment the next two lines.
; build_flags =
;     -DARDUINO_USB_CDC_ON_BOOT=1

; Hardware-independent logic compiled for the host machine and tested with
; Unity. main.cpp is excluded because it is the only file that touches the
; Arduino and ESP32Servo APIs. The language standard matches the gnu++11
; used by the Arduino ESP32 2.x core, so the tests catch newer constructs.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
build_flags =
    -std=gnu++11
