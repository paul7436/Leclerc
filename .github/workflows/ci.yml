name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host lint and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: host/requirements-dev.txt
      - name: Install test dependencies
        # The headless OpenCV build is enough for the image-processing tests.
        run: pip install -r host/requirements-dev.txt opencv-python-headless
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        working-directory: host
        run: pytest -q

  firmware:
    name: Firmware tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native unit tests
        working-directory: firmware
        run: pio test -e native
      - name: Build for the ESP32-S3
        working-directory: firmware
        run: pio run -e esp32s3
